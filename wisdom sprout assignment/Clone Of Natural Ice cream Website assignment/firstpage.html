<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="icecream.css">
</head>

<body>

  <header class="text-white text-center customHeader">*This is only a brand name and does not represent its true nature.
  </header>



  <section class="container-fluid header-section">
    <div class="header-inner">
      <div class="row align-items-center g-2">

        <!-- Naturals Logo -->
        <div class="col-12 col-md-auto text-center">
          <img src="./assets/Natural_IceCream_Logo.png" class="img-fluid naturals-img" alt="Naturals Logo">
        </div>

        <!-- Anniversary Logo -->
        <div class="col-12 col-md-auto text-center anniversary-column">
          <img src="./assets/annlogo.jpg" class="img-fluid anniversary-img" alt="Anniversary Logo">
        </div>

        <!-- Order Now -->
        <div class="col-12 col-md-auto text-center">
          <button class="btn btn-success order-button">
            Order Now
          </button>
        </div>

        <!-- Search -->
        <div class="col-12 col-md-5 ms-auto ps-md-5 search-column">
          <div class="input-group">
            <input type="text" class="form-control" placeholder="I'm looking for...">
            <button class="btn btn-success search-button">
              <span>⌕</span>
            </button>
          </div>
        </div>

      </div>
    </div>
  </section>





  <nav class="navbar navbar-expand-lg bg-dark">

    <div class="container-fluid justify-content-center">

      <button class="navbar-toggler bg-light mb-2" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu"
        aria-controls="navbarMenu" aria-expanded="false" aria-label="Toggle navigation">

        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-center" id="navbarMenu">

        <div class="navbar-nav text-center gap-lg-4">

          <a href="#" class="nav-link text-white">Tree To Treat</a>
          <a href="#" class="nav-link text-white">Our Legacy</a>
          <a href="#" class="nav-link text-white">Products</a>
          <a href="#" class="nav-link text-white">Malai Magic</a>
          <a href="#" class="nav-link text-white">Franchise Queries</a>
          <a href="#" class="nav-link text-white">Store Locator</a>

        </div>

      </div>
    </div>
  </nav>



  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
