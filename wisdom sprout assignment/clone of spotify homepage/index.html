<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

    <nav class="navbar spotify-navbar d-flex align-items-center justify-content-start gap-3 px-4">
        <div class="logo">
            <img src="assets/logo.png" alt="logo">
        </div>

        <button class="home-btn rounded-circle">
            <i class="bi bi-house-door-fill"></i>
        </button>

        <div class="search-box d-flex align-items-center gap-3 bg-dark rounded-pill px-3 py-2">

            <i class="bi bi-search text-secondary fs-4"></i>

            <input type="text" class="form-control bg-transparent border-0 text-white shadow-none"
                placeholder="What do you want to play?">

            <i class="bi bi-collection text-secondary fs-4"></i>

        </div>

        <div class="right-nav d-flex align-items-center ms-auto">
            <a href="#">Premium</a>
            <a href="#">Support</a>
            <a href="#">Download</a>
            <span>|</span>
        </div>
        <div class="right1-nav d-flex align-items-center gap-4">
            <a href="#">Install App</a>
            <a href="#">Sign up</a>
            <button class="login-btn rounded-pill px-4 py-2">Log in</button>
        </div>

    </nav>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
