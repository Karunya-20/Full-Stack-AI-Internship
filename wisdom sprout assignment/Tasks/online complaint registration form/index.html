
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Complaint Registration</title>
</head>

<body>

    <h1>Online Complaint Registration Form</h1>

    <p>Please fill out the form to register your complaint.</p>

    <hr>

    <form>

        <h2>Complaint Details</h2>

        <label>Complaint Category:</label>
        <select name="category" required>
            <option value="">Select Category</option>
            <option value="Technical">Technical Issue</option>
            <option value="Payment">Payment Issue</option>
            <option value="Service">Service Issue</option>
            <option value="Other">Other</option>
        </select>

        <br><br>

        <label>Priority:</label>
        <input type="radio" name="priority" value="Low"> Low
        <input type="radio" name="priority" value="Medium"> Medium
        <input type="radio" name="priority" value="High"> High

        <br><br>

        <label>Complaint Description:</label>
        <br>
        <textarea name="description" rows="5" cols="40"
            placeholder="Describe your complaint..." required></textarea>

        <br><br>

        <label>Attach File:</label>
        <input type="file" name="attachment">

        <hr>

        <h2>Contact Details</h2>

        <label>Full Name:</label>
        <input type="text" name="fullname" placeholder="Enter your name" required>

        <br><br>

        <label>Email:</label>
        <input type="email" name="email" placeholder="Enter your email" required>

        <br><br>

        <label>Phone Number:</label>
        <input type="tel" name="phone" placeholder="Enter phone number" required>

        <br><br>

        <label>Preferred Resolution Date:</label>
        <input type="date" name="resolutiondate">

        <br><br>

        <button type="submit">Submit Complaint</button>
        <button type="reset">Reset</button>

    </form>

    <hr>

    <footer>
        <p>© 2026 Online Complaint Portal. All Rights Reserved.</p>
    </footer>

</body>

</html>
