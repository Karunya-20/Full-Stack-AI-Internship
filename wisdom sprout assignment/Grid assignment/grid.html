<!DOCTYPE html>
<head>

    <style>

        .grid-container{
            display: grid;
            grid-template-columns: 100px 100px 100px;
            grid-template-rows: 100px 100px 100px;
            gap: 10px;


        }
        .box{
            background-color: brown;
        }


        .header-container{
            display: grid;
            grid-template-areas:

                "header header"
                "as ma"
                "ft ft";

            grid-template-columns: 1fr 3fr;
            gap: 10px;
            width: 100%;
            height: 400px;


        }
        .header{
            grid-area: header;
            background-color: red;
        }
        .aside{
            grid-area: as;
            background-color: black;
        }
        .main{
            grid-area: ma;
            background-color: cadetblue;
        }
        .footer{
            grid-area: ft;
            background-color: blueviolet;
        }
    </style>
    
</head>

<body>
    <div class="grid-container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
    </div>



    <div class="header-container">

        <header class="header">Header</header>
        <aside class="aside">Sidebar</aside>
        <main class="main">Main Content</main>
        <footer class="footer">Footer</footer>
    </div>
    
</body>
